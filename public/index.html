<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SHANEX-MD - PAIRING CODE</title>
    <style>
        body {
            background-color: #0b0c10;
            color: #d4af37;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            background: #1f2833;
            border: 2px solid #d4af37;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 0 15px rgba(212, 175, 55, 0.4);
            text-align: center;
            max-width: 400px;
            width: 90%;
        }
        h2 {
            margin-bottom: 5px;
            color: #fff;
            text-transform: uppercase;
            letter-spacing: 2px;
        }
        p {
            font-size: 14px;
            color: #c5c6c7;
        }
        input {
            width: 80%;
            padding: 12px;
            margin: 15px 0;
            border: 1px solid #d4af37;
            background: #0b0c10;
            color: #66fcf1;
            font-size: 16px;
            border-radius: 6px;
            text-align: center;
            outline: none;
        }
        button {
            padding: 12px 25px;
            background-color: #d4af37;
            color: #000;
            font-weight: bold;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 16px;
            transition: 0.3s;
        }
        button:hover {
            background-color: #45a29e;
            color: #fff;
            box-shadow: 0 0 10px #45a29e;
        }
        .code-box {
            margin-top: 20px;
            font-size: 22px;
            font-weight: bold;
            color: #66fcf1;
            letter-spacing: 3px;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>⚡ SHANEX-MD ⚡</h2>
    <p>Enter your WhatsApp number with Country Code (e.g., 9477xxxxxxx)</p>
    
    <input type="number" id="phoneNumber" placeholder="947xxxxxxxx" required>
    <br>
    <button onclick="getPairCode()">GET PAIRING CODE</button>

    <div id="result" class="code-box"></div>
</div>

<script>
    async function getPairCode() {
        const num = document.getElementById('phoneNumber').value;
        const resDiv = document.getElementById('result');
        
        if (!num) {
            resDiv.innerText = "Please enter a valid number!";
            return;
        }
        
        resDiv.innerText = "Generating Code...";
        
        try {
            const response = await fetch(`/pair?number=${num}`);
            const data = await response.json();
            
            if (data.code) {
                resDiv.innerText = `CODE: ${data.code}`;
            } else {
                resDiv.innerText = "Error getting code. Try again!";
            }
        } catch (err) {
            resDiv.innerText = "Failed to connect to server!";
        }
    }
</script>

</body>
</html>
